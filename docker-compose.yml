services:
  rebuild_the_world:
    image: nginx:alpine
    container_name: rebuild_the_world_container
    volumes:
      - .:/usr/share/nginx/html:ro
    expose:
      - 80
    ports:
      - "5003:80"
    networks:
      - my_network
    restart: always

networks:
  my_network:
    external: true
