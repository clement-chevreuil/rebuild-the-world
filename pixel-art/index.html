<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Art Editor</title>
  <link rel="stylesheet" href="../vendor-pack/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#2c5f4f">
  <link rel="apple-touch-icon" href="../icons/icon-192.png">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container-fluid">
      <span class="navbar-brand fw-bold">🎨 Pixel Art</span>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarContent">
        <div class="navbar-nav w-100 d-flex align-items-center gap-3">

          <!-- Nouveau tableau -->
          <div class="d-flex gap-2 align-items-center">
            <label class="form-label mb-0 text-white small">Taille:</label>
            <input type="number" id="width-input" class="form-control form-control-sm" value="32" min="1" placeholder="L" style="width: 60px;">
            <span class="text-white">×</span>
            <input type="number" id="height-input" class="form-control form-control-sm" value="32" min="1" placeholder="H" style="width: 60px;">
            <button id="create-btn" class="btn btn-primary btn-sm">Créer</button>
          </div>

          <div class="vr"></div>

          <!-- Couleur -->
          <div class="d-flex gap-2 align-items-center">
            <label class="form-label mb-0 text-white small">Couleur:</label>
            <input type="color" id="color-picker" class="form-control form-control-color" value="#000000" style="width: 45px; height: 38px;">
          </div>

          <div class="vr"></div>

          <!-- Historique -->
          <div class="d-flex gap-2">
            <button id="undo-btn" class="btn btn-outline-light btn-sm" disabled title="Annuler">↶</button>
            <button id="redo-btn" class="btn btn-outline-light btn-sm" disabled title="Refaire">↷</button>
          </div>

          <div class="vr"></div>

          <!-- Actions -->
          <button id="clear-btn" class="btn btn-outline-warning btn-sm" disabled>🗑 Effacer</button>

          <div class="ms-auto d-flex gap-2">
            <!-- Export -->
            <div class="btn-group" role="group">
              <button id="export-png-btn" class="btn btn-success btn-sm" disabled>PNG</button>
              <button id="export-jpg-btn" class="btn btn-success btn-sm" disabled>JPG</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <!-- Statut -->
  <div class="bg-light border-bottom py-2 px-3">
    <small id="status-text" class="text-muted">En attente…</small>
  </div>

  <!-- Canvas principal -->
  <div class="canvas-wrapper">
    <div id="pixel-grid" class="pixel-grid"></div>
  </div>

  <script src="../vendor-pack/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="js/history.js"></script>
  <script src="js/canvas.js"></script>
  <script src="js/export.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('../sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
