<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Art Editor</title>
  <link rel="stylesheet" href="../vendor-pack/vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container-fluid py-4">
    <div class="row">
      <!-- Panel gauche: contrôles -->
      <div class="col-12 col-md-3 mb-4 mb-md-0">
        <div class="controls-panel card">
          <div class="card-body">
            <h5 class="card-title">Créer un tableau</h5>

            <div class="mb-3">
              <label for="width-input" class="form-label">Largeur</label>
              <input type="number" id="width-input" class="form-control" value="32" min="1">
            </div>

            <div class="mb-3">
              <label for="height-input" class="form-label">Hauteur</label>
              <input type="number" id="height-input" class="form-control" value="32" min="1">
            </div>

            <button id="create-btn" class="btn btn-primary w-100 mb-3">Créer</button>

            <hr>

            <h5 class="card-title mt-4">Outils</h5>

            <div class="mb-3">
              <label for="color-picker" class="form-label">Couleur</label>
              <input type="color" id="color-picker" class="form-control form-control-color" value="#000000">
            </div>

            <button id="undo-btn" class="btn btn-outline-secondary btn-sm w-100 mb-2" disabled>
              ↶ Annuler
            </button>
            <button id="redo-btn" class="btn btn-outline-secondary btn-sm w-100 mb-3" disabled>
              ↷ Refaire
            </button>

            <button id="clear-btn" class="btn btn-warning w-100 mb-3" disabled>
              🗑 Effacer tout
            </button>

            <hr>

            <h5 class="card-title mt-4">Export</h5>

            <div class="btn-group w-100" role="group">
              <button id="export-png-btn" class="btn btn-success btn-sm" disabled>PNG</button>
              <button id="export-jpg-btn" class="btn btn-success btn-sm" disabled>JPG</button>
            </div>

            <div class="mt-3 text-muted small">
              <p id="status-text">En attente…</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Panel droit: canvas -->
      <div class="col-12 col-md-9">
        <div class="canvas-container card">
          <div class="card-body d-flex justify-content-center align-items-center">
            <div id="pixel-grid" class="pixel-grid"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../vendor-pack/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="js/history.js"></script>
  <script src="js/canvas.js"></script>
  <script src="js/export.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
